<script

</script>

<!-- 2. Custom Google Apps Script Analytics -->
<script>
(() => {
  const ENDPOINT =
    'https://script.google.com/macros/s/AKfycbwU6LV41rrbbRiBnw6jvKNZZhCvbJspd2CKLUIov1TqQsRmZVSRFAzLrkYXcvWQ9TY3/exec';

  const start = Date.now();
  let interacted = false;
  let sent = false;

  // Detect visitor interaction
  const markInteraction = () => {
    interacted = true;
  };

  ['mousedown', 'touchstart', 'wheel', 'keydown']
    .forEach(eventName => {
      addEventListener(eventName, markInteraction, {
        once: true,
        passive: true
      });
    });

  function sendAnalytics() {
    if (sent) return;

    const payload = JSON.stringify({
      page: location.pathname + location.search,
      ms: Date.now() - start,
      interacted: interacted,
      ref: document.referrer || null,
      ts: new Date().toISOString()
    });

    if (navigator.sendBeacon(ENDPOINT, payload)) {
      sent = true;
    }
  }

  // Record visit when page becomes hidden
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      sendAnalytics();
    }
  });

  // Fallback when visitor leaves
  addEventListener('pagehide', sendAnalytics);
})();
</script>
